<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center vh-100">
  <div class="card shadow mx-auto p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-3">Đăng Nhập Quản Trị</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/login" method="POST">
      <div class="mb-3">
        <label class="form-label">Mật khẩu Admin:</label>
        <input type="password" name="password" class="form-control" required autofocus>
      </div>
      <button type="submit" class="btn btn-dark w-100">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
