<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị</title>
    <!-- THÊM DÒNG NÀY ĐỂ CÓ ICON TRÊN TAB -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 50%; width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #212529; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #343a40; }
        .alert { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <!-- ĐÃ XÓA ẢNH LOGO TRÊN THÂN TRANG -->
        <h2>Đăng Nhập Quản Trị</h2>

        {% with messages = get_flashed_messages(category_filter=["danger"]) %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">⚠️ {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="password">Mật khẩu Admin:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required autofocus>
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
