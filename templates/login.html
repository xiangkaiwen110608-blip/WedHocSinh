<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #1a1a1a; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #111;
            font-size: 1.6rem;
        }
        .form-group { 
            margin-bottom: 1.2rem; 
            text-align: left; 
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #333;
        }
        input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #212529;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #212529; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: bold;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #000;
        }
        .alert-danger { 
            padding: 10px 14px; 
            margin-bottom: 1.2rem; 
            border-radius: 6px; 
            background-color: #f8d7da; 
            color: #842029; 
            border: 1px solid #f5c2c7;
            font-size: 0.9rem; 
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Đăng Nhập Quản Trị</h2>
        
        {# Chỉ hiển thị thông báo lỗi riêng cho đăng nhập #}
        {% with messages = get_flashed_messages(category_filter=["danger"]) %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-danger">⚠️ {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="password">Mật khẩu Admin:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required autofocus>
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
