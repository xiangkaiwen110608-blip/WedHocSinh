<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Góp Ý Thành Công</title>
    <!-- THÊM DÒNG NÀY ĐỂ CÓ ICON TRÊN TAB -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card { 
            max-width: 450px; 
            width: 100%;
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
        }
        .icon-success {
            width: 70px;
            height: 70px;
            background: #e6f4ea;
            color: #28a745;
            font-size: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        h2 { 
            color: #28a745; 
            margin-bottom: 10px;
            font-size: 24px;
        }
        p { 
            color: #555; 
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-home { 
            display: inline-block;
            width: 100%;
            padding: 12px 0; 
            background: #007bff; 
            color: white; 
            text-decoration: none;
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.2s ease;
        }
        .btn-home:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- ĐÃ XÓA ẢNH LOGO TRÊN THÂN TRANG -->
        <div class="icon-success">✓</div>
        <h2>Đã Gửi Thành Công!</h2>
        <p>Cảm ơn bạn đã đóng góp ý kiến! Ý kiến của bạn là giúp cho chúng ta cải thiện môi trường học tốt hơn!</p>
        <a href="/" class="btn-home">Gửi góp ý khác</a>
    </div>
</body>
</html>
